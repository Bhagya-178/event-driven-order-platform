[project]
name = "order-service"
version = "0.1.0"
description = "Order Service for Event-Driven Platform"
dependencies = [
    "aiokafka>=0.11.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.28",
    "alembic>=1.11",
    "python-json-logger>=2.0",
    "redis>=5.0",
    "prometheus-client>=0.19.0"
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "black",
    "isort",
    "mypy"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
