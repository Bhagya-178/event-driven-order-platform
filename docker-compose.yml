version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: edp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: default_db
    ports:
      - "5433:5432"
    volumes:
      - ./backend/infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: edp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: edp-kafka-init
    depends_on:
      - kafka
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for Kafka broker to be ready..."
        cub kafka-ready -b kafka:29092 1 120
        echo "Creating Kafka topics and DLQ channels..."
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic orders.events
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic payments.events
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic inventory.events
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic orders.events.dlq
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic payments.events.dlq
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic inventory.events.dlq
        echo "All Kafka topics and DLQs initialized successfully. Init job completed."

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: edp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend/infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  order-service:
    build:
      context: .
      dockerfile: backend/services/order-service/Dockerfile
    container_name: edp-order-service
    ports:
      - "8000:8000"
    environment:
      ORDER_DB_URL: postgresql+asyncpg://order_user:${ORDER_DB_PASSWORD:-order_pass}@postgres:5432/orders_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      ORDER_SERVICE_HOST: 0.0.0.0
      ORDER_SERVICE_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  payment-service:
    build:
      context: .
      dockerfile: backend/services/payment-service/Dockerfile
    container_name: edp-payment-service
    ports:
      - "8001:8001"
    environment:
      PAYMENT_DB_URL: postgresql+asyncpg://payment_user:${PAYMENT_DB_PASSWORD:-payment_pass}@postgres:5432/payments_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      PAYMENT_PORT: 8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  inventory-service:
    build:
      context: .
      dockerfile: backend/services/inventory-service/Dockerfile
    container_name: edp-inventory-service
    ports:
      - "8002:8002"
    environment:
      INVENTORY_DB_URL: postgresql+asyncpg://inventory_user:${INVENTORY_DB_PASSWORD:-inventory_pass}@postgres:5432/inventory_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      INVENTORY_PORT: 8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edp-frontend
    ports:
      - "3000:80"
    depends_on:
      - order-service
      - payment-service
      - inventory-service

